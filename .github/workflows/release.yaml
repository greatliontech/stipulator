name: Release

# The release gate: a tag is cut only after the CI workflow — the
# fleet's gate (greatliontech/actions go-gate.yml: the plain, race and
# records tiers) — succeeded on the pushed commit. The rules that keep
# the tag on the judged commit live in the called workflow
# (go-release.yml): a push run of this repository, the tip-of-main
# check, semrel targeting the judged commit. This caller supplies the
# trigger, the serializing group (one running and one pending run; a
# third arrival cancels the pending one — fail-safe: no wrong tag is
# cut), the releaser app's secret and the write permission.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: greatliontech/actions/.github/workflows/go-release.yml@main
    permissions:
      contents: write
    secrets: inherit
