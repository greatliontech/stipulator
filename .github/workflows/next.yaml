name: Next

# The early-warning legs (greatliontech/actions go-next.yml), their own
# workflow: next-rc builds and tests under a published Go release
# candidate (a candidate the pinned gofresh does not yet list reds this
# loudly for the whole freeze window), next-stable runs the fast tier
# under the current stable release, so a point release that moves the
# audited bytes reds here as soon as it is published while the gate
# stays on its pinned listing. Neither is a release gate: a red here
# must never block a release of the tree as it stands (the CI
# workflow's tiers are the gate release.yaml waits for). Same triggers
# as CI; the tiers' inputs are CI's (ci.yaml states their provenance).

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  next:
    uses: greatliontech/actions/.github/workflows/go-next.yml@main
    with:
      pattern: github.com/greatliontech/stipulator/...
      pre: go run github.com/go-task/task/v3/cmd/task@v3.53.1 fmt-check tidy-check
      short: true
      short-timeout: 5m
      full-timeout: 75m
      job-minutes: 120
