name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Successive PR pushes supersede (per-ref group, cancelled on the next
# push). Main is keyed per-SHA so no two main runs ever share a group:
# by default GitHub cancels a group's PENDING member (cancel-in-progress
# governs only the running one), so a shared main group would leave
# rapid-push intermediate commits verdictless — and every main commit's
# verdict is what release.yaml waits for before it tags that commit.
# Per-SHA grouping removes the collision structurally while keeping a
# concurrency stanza PRs can reuse.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

# This workflow IS the release gate: release.yaml cuts a tag only after
# every job of the fleet's gate (greatliontech/actions go-gate.yml: the
# plain, race and records tiers) succeeded on the pushed commit. The
# tool's own check verdict (the tool over its own tree) has no seat
# here and is no release precondition (the train's doctrine, amended
# 2026-10-02: the gate is CI's three tiers): it runs at a band's
# close, where a chunk's charter names its own verdict, and in the
# weekly fleet sweep (gofresh scripts/fleet-sweep.sh) — never before a
# release, never at a chunk's close-out, never on a cold runner. The
# inputs are this repository's own facts:
#
# go-version pins the stock release the pinned gofresh's toolchain
# audit lists (its go1.27.1 chain row) — never `stable`, which would
# make a commit's releasability a function of Go's release calendar;
# a point release that moves the audited bytes reds the next-stable
# leg (next.yaml) first, and the listing lands in gofresh before the
# pin moves. go.mod's `go 1.27.0` is a minimum, not a pin.
#
# pattern: the module-path pattern is load-bearing — `./...` spans only
# the root module in workspace mode and would drop the stipulate and
# stipulate/structural members. pre: the workspace hygiene the
# Taskfile defines for exactly this seat (gofmt cleanliness, per-module
# tidy go.mod/go.sum — workspace-mode CI cannot see per-module drift).
#
# full-timeout: the suite budget as CI measured it on the 4-vCPU
# runner (run 37455430767, 2026-10-06, the last plain run before this
# gate): internal/backends/golang 2939s, check 1162s, cmd 613s — the
# same package runs ~1800s on the 24-core dev host, so core count IS
# a factor here (+63%; the 2026-08-27 "non-factor" measurement no
# longer holds); 75m is 1.53x over the slowest package. A cold cache
# lands on the job ceiling, not this flag. An overrun is a real
# finding — re-measure before raising the number.
#
# race: on — the policy's three invocations (.stipulator/policy.textproto)
# run under the detector, so the gate's race tier runs the same
# selection; race-p 2 keeps two race binaries' heaps inside the
# runner's memory; race-timeout mirrors the policy's 100m per-binary
# cap for the root module (the stipulate members' 30m cap reads
# looser here, never stricter); the estimate from the policy's own
# dev-host ratio (race 2685s against ~1800s plain for backends/golang,
# 1.49x) puts the package at ~73m on the runner, 1.37x under the cap,
# with check and cmd serialized in the second slot — the first run of
# the race job IS the budget's measurement.
#
# records: on, with stipulator built from THIS tree (the fleet's
# records tier otherwise installs a pinned release, which here could
# not read a record-format move the tree makes, so no tag could ever
# be cut to move the pin).

jobs:
  gate:
    uses: greatliontech/actions/.github/workflows/go-gate.yml@main
    with:
      go-version: "1.27.1"
      pattern: github.com/greatliontech/stipulator/...
      pre: go run github.com/go-task/task/v3/cmd/task@v3.53.1 fmt-check tidy-check
      short: true
      short-timeout: 5m
      full-timeout: 75m
      test-job-minutes: 120
      race: true
      race-p: 2
      race-timeout: 100m
      race-job-minutes: 150
      records: true
      stipulator-from-tree: true
